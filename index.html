<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07040a">
<title>宝箱地牢</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #07040a; overflow: hidden; user-select: none; }
  body { position: relative; }
  #stage { position: relative; flex: none; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #game { image-rendering: pixelated; image-rendering: crisp-edges; }
  #hi { pointer-events: none; }
  #desktop-help { position: fixed; bottom: 4px; left: 50%; transform: translateX(-50%); margin: 0; max-width: calc(100vw - 16px); color: #a096aa; font: 11px/20px "Microsoft YaHei", sans-serif; white-space: nowrap; pointer-events: none; text-shadow: 0 1px 3px #000; }
  #stage { touch-action: none; }
  #mobile-controls[hidden], #mobile-controls [hidden], #mobile-rotate[hidden] { display: none !important; }
  html[data-mobile="true"] #desktop-help { display: none; }
  html[data-mobile="true"] .lan-card input { font-size: 16px; }
  #mobile-controls { position: fixed; inset: 0; z-index: 10; pointer-events: none; font: 13px "Microsoft YaHei",sans-serif; }
  #mobile-controls button { appearance: none; touch-action: none; pointer-events: auto; color: #ffe8bb; border: 1px solid #a68d69a6; background: #1e152bd9; border-radius: 12px; font: inherit; min-width: 44px; min-height: 44px; -webkit-tap-highlight-color: transparent; }
  #mobile-controls button[data-held="true"] { background: #685139e6; border-color: #ffe1a0; }
  #mobile-controls button:focus-visible { outline: 2px solid #ffe1a0; }
  #mobile-stick { position: absolute; width: 112px; height: 112px; border: 1px solid #a68d69a6; border-radius: 50%; background: #1710208c; pointer-events: none; }
  #mobile-stick span { position: absolute; left: 35px; top: 35px; width: 40px; height: 40px; border: 1px solid #d2b589; border-radius: 50%; background: #93765485; pointer-events: none; }
  #mobile-actions { position: absolute; right: max(16px,env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 54px 76px 64px; gap: 10px; align-items: end; }
  #mobile-attack { grid-column: 2; grid-row: 1 / 3; width: 76px; height: 76px; border-radius: 50% !important; color: #ffe5a3 !important; font-size: 17px !important; }
  #mobile-charge { grid-column: 3; grid-row: 1 / 3; width: 64px; height: 64px; padding: 0 3px; border-radius: 50% !important; color: #bceaff !important; border-color: #6eafc4 !important; background: #152737eb !important; }
  #mobile-charge[data-held="true"] { background: #2c5067ee !important; }
  #mobile-charge[data-ready="true"] { border-color: #fff0ae !important; color: #fff0ae !important; box-shadow: 0 0 8px #ffe1a066; }
  #mobile-roll,#mobile-interact { width: 54px; height: 48px; }
  #mobile-tools { position: absolute; bottom: calc(6px + env(safe-area-inset-bottom)); left: calc(50% - 35px); transform: translateX(-50%); display: flex; gap: 6px; }
  #mobile-tools button { padding: 0 9px; }
  #mobile-tip { position: absolute; bottom: calc(58px + env(safe-area-inset-bottom)); left: calc(50% - 70px); transform: translateX(-50%); max-width: calc(100vw - 390px); margin: 0; color: #cfbadd; font-size: 11px; line-height: 14px; text-align: center; text-shadow: 0 1px 3px #000; }
  #mobile-rotate { position: fixed; inset: 0; z-index: 40; display: grid; place-content: center; gap: 14px; text-align: center; background: #100a19f5; color: #f3d8a4; font: 18px "Microsoft YaHei",sans-serif; touch-action: none; }
  #mobile-rotate small { font-size: 13px; color: #bfaacb; }
  #menu-back { position: fixed; top: max(12px,env(safe-area-inset-top)); right: max(12px,env(safe-area-inset-right)); z-index: 14; min-width: 64px; min-height: 44px; padding: 0 14px; border: 1px solid #a68d69a6; border-radius: 6px; color: #ffe8bb; background: #1e152bd9; font: 14px "Microsoft YaHei",sans-serif; cursor: pointer; touch-action: manipulation; }
  #menu-back[hidden] { display: none !important; }
  #menu-back:focus-visible { outline: 2px solid #ffe1a0; }
  .lan-overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #080612ad; color: #e8decb; font: 13px "Microsoft YaHei",sans-serif; text-shadow: 1px 2px #07040b; }
  .lan-overlay[hidden], .lan-overlay [hidden] { display: none !important; }
  .lan-card,.lan-confirm { box-sizing: border-box; width: min(430px,calc(100vw - 80px)); max-height: calc(100vh - 60px); padding: 16px 22px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #766255 transparent; background: radial-gradient(ellipse,#20172775,transparent 75%); }
  .lan-head { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 18px; }.lan-titles { flex: 1; }
  .lan-kicker { font-size: 10px; color: #c4ad90; letter-spacing: 3px; }
  .lan-card h1 { margin: 10px 0 0; color: #f1d9a4; font-size: 28px; letter-spacing: 5px; font-weight: 500; }
  .lan-link-state { font-size: 11px; color: #aaa0b5; margin: 0 0 22px; }.lan-link-state::before { content: ''; display: inline-block; width: 4px; height: 4px; margin: 0 8px 1px 0; background: #94839b; }
  .lan-overlay[data-connected="true"] .lan-link-state::before { background: #a4ce8d; }
  .lan-card label { display: grid; gap: 7px; color: #c0afc7; font-size: 11px; }
  .lan-card input,.lan-card select { min-width: 0; box-sizing: border-box; width: 100%; height: 36px; border-radius: 0; border: 0; border-bottom: 1px solid #ad926b85; background: #100a181f; color: #eedcc1; padding: 5px 0; font: 13px "Microsoft YaHei",sans-serif; outline: none; box-shadow: none; }
  .lan-card select option { background: #171322; }.lan-card input::placeholder { color: #a190ac; font-size: 12px; }.lan-card input:focus,.lan-card select:focus { border-bottom-color: #eed293; }
  .lan-button { appearance: none; position: relative; display: inline-block; border: 0; border-radius: 0; background: none; color: #cbb9cc; box-shadow: none; padding: 9px 0 9px 17px; font: 13px "Microsoft YaHei",sans-serif; text-align: left; cursor: pointer; text-shadow: 1px 2px #090514; transition: color .12s,transform .12s; }
  .lan-button::before { content: ''; position: absolute; left: 0; top: calc(50% - 3px); width: 5px; height: 5px; transform: rotate(45deg); background: #b58d55; opacity: 0; }
  .lan-button:hover,.lan-button:focus-visible { color: #ffe5ad; transform: translateX(3px); outline: none; }.lan-button:hover::before,.lan-button:focus-visible::before { opacity: 1; }
  .lan-primary { color: #efd3a0; font-size: 20px; letter-spacing: 3px; padding: 12px 0 12px 20px; }.lan-primary::before { opacity: 1; width: 6px; height: 6px; background: #e5be6e; }
  .lan-button:disabled { color: #9f8da5; cursor: default; transform: none; }.lan-button:disabled::before { opacity: 0; }.lan-quiet { font-size: 11px; color: #b3a0bc; }.lan-x { font: 24px/26px sans-serif; padding: 0 4px; }.lan-x::before { display: none; }
  .lan-transports { display: flex; gap: 20px; margin-bottom: 18px; }.lan-transports .lan-button[aria-pressed="true"] { color: #ffe5ad; border-bottom: 1px solid #ad926b; }
  .lan-connect { display: flex; flex-direction: column; gap: 18px; margin-top: 18px; }.lan-connect label { margin-top: 8px; }.lan-connect .lan-button { align-self: flex-start; }
  .lan-address-line { margin: 0; color: #b6a7bc; font-size: 11px; }.lan-share { margin-top: 6px; display: flex; align-items: center; gap: 9px; }.lan-share select { font: 12px Consolas,monospace; color: #c4e4e8; height: 34px; }.lan-share .lan-button { flex: none; font-size: 11px; padding-left: 8px; }
  .lan-party { display: grid; gap: 15px; margin: 28px 0; }.lan-player-line { display: flex; align-items: center; justify-content: space-between; gap: 16px; color: #edc77e; }.lan-player-line[data-slot="1"] { color: #87cfe8; }.lan-player-line[data-slot="2"] { color: #a6d78f; }.lan-player-line[data-slot="3"] { color: #c995ec; }.lan-player-line>span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }.lan-player-line>span:last-child { flex: none; color: #a69ab0; font-size: 10px; }
  .lan-help,.lan-room-hint { color: #b9a8c2; font-size: 11px; line-height: 1.9; margin: 22px 0 14px; }
  .lan-footer { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 12px; }.lan-note { margin: 0; color: #c0a7b7; font-size: 11px; line-height: 1.7; }
  .lan-confirm { text-align: center; width: min(450px,calc(100vw - 80px)); padding: 22px 32px; }
  .lan-confirm h2 { font-size: 29px; color: #f2d9a1; letter-spacing: 6px; font-weight: 500; margin: 15px 0 25px; }
  .lan-confirm-destination { font-size: 15px; color: #e6cbb0; line-height: 1.7; margin: 0; }.lan-confirm-difficulty { font-size: 11px; color: #c2adc9; letter-spacing: 2px; margin: 8px 0 28px; }
  .lan-confirm-party { display: grid; gap: 16px; text-align: left; }.lan-confirm-player { display: flex; gap: 14px; align-items: center; justify-content: space-between; font-size: 12px; color: #edc77e; }.lan-confirm-player[data-slot="1"] { color: #87cfe8; }.lan-confirm-player[data-slot="2"] { color: #a6d78f; }.lan-confirm-player[data-slot="3"] { color: #c995ec; }
  .lan-confirm-player>span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }.lan-confirm-player>span:last-child { flex: none; color: #ad96b7; font-size: 10px; }.lan-confirm-player.agreed>span:last-child { color: #b5dca1; }
  .lan-confirm-hint { color: #bba3c4; font-size: 11px; line-height: 1.7; margin: 27px 0 13px; }.lan-confirm-actions { display: flex; align-items: center; flex-direction: column; gap: 9px; }.lan-confirm-actions .lan-primary { text-align: center; font-size: 21px; }.lan-confirm-actions .lan-button:not(.lan-primary) { font-size: 11px; }
  .lan-overlay[data-motion="false"] .lan-button { transition: none; }
  @media (max-height: 640px) { .lan-card,.lan-confirm { max-height: calc(100vh - 36px); padding-top: 10px; padding-bottom: 10px; }.lan-head { margin-bottom: 12px; }.lan-link-state { margin-bottom: 16px; }.lan-connect { gap: 14px; }.lan-help { margin-top: 16px; }.lan-confirm h2 { margin: 10px 0 16px; }.lan-confirm-difficulty { margin-bottom: 21px; }.lan-confirm-party { gap: 13px; }.lan-confirm-hint { margin-top: 20px; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="320" height="180"></canvas>
  <canvas id="hi"></canvas>
</div>
<p id="desktop-help">WASD 移动 · 鼠标瞄准 / 左键攻击 · 空格闪避 · E 互动 · M 地图 · J 任务 · Tab 装备 · Esc 暂停 / 返回 · F 全屏 · N 静音</p>
<div id="mobile-controls" hidden aria-label="触屏操作">
  <div id="mobile-stick" hidden aria-hidden="true"><span id="mobile-stick-knob"></span></div>
  <div id="mobile-actions">
    <button id="mobile-roll" type="button">闪避</button>
    <button id="mobile-interact" type="button">互动</button>
    <button id="mobile-attack" type="button" aria-label="点按普通攻击，长按自动连续攻击">攻击</button>
    <button id="mobile-charge" type="button" aria-label="按住0.8秒蓄力，松手释放，拖动瞄准">蓄力</button>
  </div>
  <div id="mobile-tools">
    <button id="mobile-map" type="button">地图</button>
    <button id="mobile-journal" type="button">任务</button>
    <button id="mobile-pause" type="button">装备</button>
  </div>
  <p id="mobile-tip"></p>
</div>
<button id="menu-back" type="button" hidden aria-label="返回上一界面">返回</button>
<div id="mobile-rotate" hidden><span>请将手机横过来</span><small>横屏后即可继续游戏</small></div>
<img id="costume-atlas" src="assets/costumes/knight-skins.png" hidden alt="">
<img id="violet-star-art" src="assets/costumes/violet-star.png" hidden alt="">
<!-- 经典脚本，按顺序共享全局作用域。新增文件请放进正确的分组；tools/tests/scripts.cjs 会检查 js/ 与这里一一对应，eslint 会检查未定义引用。 -->
<!-- ===== 核心 / 配置 / 资源（其余所有脚本都依赖这里的全局：G, TS/RW/RH, CONFIG, SFX, SPR, META） ===== -->
<script src="js/core.js"></script>
<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/bgm.js"></script>
<script src="js/sprites.js"></script>
<script src="js/meta.js"></script>
<!-- ===== 世界与实体（地牢生成、物品、敌人/玩家、宝箱、主城、菜单、地图、神龛） ===== -->
<script src="js/dungeon.js"></script>
<script src="js/items.js"></script>
<script src="js/entities.js"></script>
<script src="js/chest.js"></script>
<script src="js/town.js"></script>
<script src="js/menus.js"></script>
<script src="js/worldmap.js"></script>
<script src="js/shrine.js"></script>

<script src="js/render.js"></script>

<script src="js/classes.js"></script>
<script src="js/talents.js"></script>
<script src="js/enemy-attacks.js"></script>
<script src="js/act-kit.js"></script>
<script src="js/act2.js"></script>
<script src="js/act3.js"></script>
<script src="js/act4.js"></script>
<script src="js/act5.js"></script>
<script src="js/act6.js"></script>
<!-- ===== 装备内容与美术 ===== -->
<script src="js/act-gear.js"></script>

<script src="js/weapon-roster.js"></script>
<script src="js/armor-roster.js"></script>

<script src="js/boot-roster.js"></script>

<script src="js/town-npc-art.js"></script>
<!-- ===== UI / 任务 / 主城服务 / 标题 ===== -->
<script src="js/ui.js"></script>
<script src="js/quest-campaign-expansion.js"></script>
<script src="js/quest-side-expansion.js"></script>
<script src="js/town-quests.js"></script>
<script src="js/town-services.js"></script>

<script src="js/costume-art.js"></script>
<script src="js/signin.js"></script>

<!-- ===== 主循环（boot 在 window load 时才运行，所以后面的脚本仍可在启动前注册/覆盖） ===== -->
<script src="js/game.js"></script>

<script src="js/tables.js"></script>

<script src="js/melee-combat.js"></script>
<script src="js/boss-mechanics.js"></script>
<script src="js/encounter-mechanics.js"></script>

<script src="js/floor-map-ui.js"></script>
<script src="js/mobile-input.js"></script>
<script src="js/tap-progress.js"></script>
</body>
</html>
